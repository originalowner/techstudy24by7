<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini Content Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    width:500px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:100px;
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#43a047;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f9f9f9;
    border-radius:6px;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="container">

<h2>Gemini Content Generator</h2>

<textarea id="prompt" placeholder="Enter your prompt here..."></textarea>

<button onclick="generateContent()">Generate</button>

<div class="result" id="result">Output will appear here...</div>

</div>

<script>

async function generateContent(){

    const prompt = document.getElementById("prompt").value;
    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "Generating...";

    try{

        const response = await fetch(
            "https://21mti522j3.execute-api.ap-south-1.amazonaws.com/generate",
            {
                method: "POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    prompt: prompt
                })
            }
        );

        const data = await response.json();

        resultDiv.innerHTML =
            //"📄 Generated Content:\n\n" +
            //data.output +
            "\n\n📁 Stored in S3 Key:\n" +
            data.s3_key;

    }
    catch(error){
        resultDiv.innerHTML = "Error calling API: " + error;
    }

}
</script>

</body>
</html>
