
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini Content Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:white;
    padding:30px;
    width:500px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:100px;
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
    resize:none;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    width:100%;
}

button:hover{
    background:#43a047;
}

button:disabled{
    background:#9e9e9e;
    cursor:not-allowed;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f9f9f9;
    border-radius:6px;
    white-space:pre-wrap;
    font-size:14px;
    line-height:1.5;
}

.link{
    color:#1a73e8;
    text-decoration:none;
    word-break:break-all;
}

.link:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="container">

<h2>Gemini Content Generator</h2>

<textarea id="prompt" placeholder="Enter your prompt here..."></textarea>
<!-- <textarea id="category" placeholder="Enter your category here..."></textarea> -->

<!-- ✅ NEW IMAGE INPUT -->
<input type="file" id="imageInput" accept="image/*" />

<button id="generateBtn" onclick="generateContent()">Generate</button>

<div class="result" id="result">Output will appear here...</div>

</div>


<script>
async function generateContent(){

    const prompt = document.getElementById("prompt").value.trim();
    const imageFile = document.getElementById("imageInput").files[0];
    const resultDiv = document.getElementById("result");
    const button = document.getElementById("generateBtn");

    if(!prompt){
        resultDiv.innerHTML = "⚠️ Please enter a prompt.";
        return;
    }

    resultDiv.innerHTML = "⏳ Generating...";
    button.disabled = true;

    try {

        let base64Image = null;

        // ✅ Convert image to base64 if selected
        if (imageFile) {
            console.log("🔄 Converting image to base64...0");
            base64Image = await new Promise((resolve, reject) => {
                console.log("🔄 Converting image to base64...1");
                const reader = new FileReader();
                console.log("🔄 Converting image to base64...2");
                reader.onload = () => {
                    console.log("🔄 Converting image to base64...3");
                    resolve(reader.result.split(",")[1]); // remove metadata
                    console.log("🔄 Converting image to base64...4");
                };
                console.log("🔄 Converting image to base64...5");
                reader.onerror = reject;
                console.log("🔄 Converting image to base64...6");
                reader.readAsDataURL(imageFile);
                console.log("🔄 Converting image to base64...7");
            });
	    console.log("🔄 Converting image to base64...8");
        }
	console.log("🔄 Converting image to base64...9");

        const response = await fetch(
            "https://n3dxch9cfj.execute-api.eu-west-3.amazonaws.com/generate",
            {
                method: "POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    prompt: prompt,
                    image: base64Image,          // ✅ NEW FIELD
                    filename: imageFile ? imageFile.name : null
                })
            }
        );
	console.log("🔄 Converting image to base64...10");

        const data = await response.json();
	console.log("🔄 Converting image to base64...11");

        if (response.ok) {
            const slug = data.slug;

            const url = `https://www.techstudy24by7.com/blog/${slug}`;

            resultDiv.innerHTML =
                "✅ Uploaded Successfully\n\n" +
                "📁 Data File Path:\n" +
                data.data_file_path + "\n\n" +
                "🔗 Blog URL:\n" +
                `<a href="${url}" target="_blank">${url}</a>`;
        } else {
            resultDiv.innerHTML = "❌ Error:\n" + JSON.stringify(data, null, 2);
        }

    }
    catch(error){
        resultDiv.innerHTML = "❌ Network Error:\n" + error;
    }
    finally{
        button.disabled = false;
    }
}
</script>

</body>
</html>
