<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStudy24By7 — C Tutorial</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
* {
  margin: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
    }

    /* Layout */
    .layout {
        display: flex;
        height: 100vh;
    }

    /* Sidebar */
    .sidebar {
        width: 260px;
        background: #212529;
        color: white;
        padding: 15px;
        overflow-y: auto;
    }

    .sidebar h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .sidebar a {
        display: block;
        color: #ddd;
        text-decoration: none;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 5px;
    }

    .sidebar a:hover,
    .sidebar a.active {
        background: #0d6efd;
        color: white;
    }

    /* Content */
    .content {
        flex: 1;
        padding: 30px;
        background: white;
        overflow-y: auto;
    }

    .content h1 {
        color: #0d6efd;
    }

    /* Navigation Buttons */
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
    }

    .nav-buttons button {
        padding: 10px 20px;
        border: none;
        background: #0d6efd;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
    }

    .nav-buttons button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
</style>
</head>

<body>

<!-- Header -->
<div data-include="/header.html"></div>
    
<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>C Tutorial</h2>
        <a href="#" onclick="loadLesson(0)" class="active">Introduction to Python</a>
        <a href="#" onclick="loadLesson(1)">Variables and Data Types</a>
        <a href="#" onclick="loadLesson(2)">Functions</a>
        <a href="#" onclick="loadLesson(3)">Object-Oriented Programming (OOP)</a>
        <a href="#" onclick="loadLesson(4)">Classes and Methods</a>
        <a href="#" onclick="loadLesson(5)">Inheritance</a>
        <a href="#" onclick="loadLesson(6)">File Handling</a>
        <a href="#" onclick="loadLesson(7)">Exception Handling</a>
        <a href="#" onclick="loadLesson(8)">Modules</a>
        <a href="#" onclick="loadLesson(9)">Decorators</a>
        <a href="#" onclick="loadLesson(10)">Generators</a>
        <a href="#" onclick="loadLesson(11)">Virtual Environments</a>
        <a href="#" onclick="loadLesson(12)">Async Programming</a>
        <a href="#" onclick="loadLesson(13)">Working with APIs</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1 id="title"></h1>
        <p id="lesson"></p>

        <div class="nav-buttons">
            <button id="prevBtn" onclick="prevLesson()">⬅ Previous</button>
            <button id="nextBtn" onclick="nextLesson()">Next ➡</button>
        </div>
    </div>

</div>
    
<!-- Footer -->
<div data-include="/footer.html"></div>

<script>
    const lessons = [
        {
            title: "Introduction to Python",
            content: "Python is a powerful, easy-to-read programming language used for web development, AI, automation, and more.\n\nPractice:\n1. Install Python.\n2. Open terminal and run: print('Hello World')."
        },
        {
            title: "Variables and Data Types",
            content: "Variables store data.\n\nx = 10\nname = 'Alice'\n\nData types include int, float, str, bool, list, tuple, dict.\n\nPractice:\n1. Create a variable storing your age.\n2. Create a list of 3 favorite foods."
        },
        {
            title: "Functions",
            content: "Functions are reusable blocks of code.\n\ndef greet(name):\n    return 'Hello ' + name\n\nPractice:\n1. Create a function that adds two numbers.\n2. Create a function that returns the square of a number."
        },
        {
            title: "Object-Oriented Programming (OOP)",
            content: "OOP organizes code using classes and objects.\n\nMain concepts:\n- Class\n- Object\n- Inheritance\n- Encapsulation\n- Polymorphism\n\nPractice:\n1. Create a Car class with brand and year.\n2. Create an object from it."
        },
        {
            title: "Classes and Methods",
            content: "Example:\n\nclass Person:\n    def __init__(self, name):\n        self.name = name\n\n    def greet(self):\n        print('Hello ' + self.name)\n\nPractice:\n1. Add an age attribute.\n2. Add a method that prints age."
        },
        {
            title: "Inheritance",
            content: "Inheritance allows one class to inherit another.\n\nclass Animal:\n    def speak(self):\n        print('Animal speaks')\n\nclass Dog(Animal):\n    pass\n\nPractice:\n1. Override the speak() method in Dog.\n2. Create another child class."
        },
        {
            title: "File Handling",

n2. Read and print it.Writing:\n\nwith open('file.txt','w') as f:\n    f.write('Hello')\n\nReading:\n\nwith open('file.txt','r') as f:\n    print(f.read())\n\nPractice:\n1. Write your name to a file.\n2. Read and print it.Writing:\n\nwith open('file.txt','w') as f:\n    f.write('Hello')\n\nReading:\n\nwith open('file.txt','r') as f:\n    print(f.read())\n\nPractice:\n1. Write your name to a file.\n2. Read and print it.Writing:\n\nwith open('file.txt','w') as f:\n    f.write('Hello')\n\nReading:\n\nwith open('file.txt','r') as f:\n    print(f.read())\n\nPractice:\n1. Write your name to a file.\n2. Read and print it.Writing:\n\nwith open('file.txt','w') as f:\n    f.write('Hello')\n\nReading:\n\nwith open('file.txt','r') as f:\n    print(f.read())\n\nPractice:\n1. Write your name to a file.\n2. Read and print it."
        },
        {
            title: "Exception Handling",
            content: "Use try and except to prevent crashes.\n\ntry:\n    x = 5/0\nexcept ZeroDivisionError:\n    print('Error')\n\nPractice:\n1. Handle ValueError for invalid input.\n2. Add a finally block."
        },
        {
            title: "Modules",
            content: "Modules are Python files.\n\nimport math\nprint(math.sqrt(16))\n\nPractice:\n1. Import random module.\n2. Generate a random number."
        },

        // ===== MORE ADVANCED TOPICS =====

        {
            title: "Decorators",
            content: "Decorators modify functions.\n\nExample:\n\ndef decorator(func):\n    def wrapper():\n        print('Before')\n        func()\n        print('After')\n    return wrapper\n\n@decorator\ndef say_hello():\n    print('Hello')\n\nPractice:\n1. Create a decorator that logs function name.\n2. Apply it to a function."
        },
        {
            title: "Generators",
            content: "Generators return values one at a time using yield.\n\nExample:\n\ndef count_up():\n    for i in range(5):\n        yield i\n\nPractice:\n1. Create a generator that yields even numbers.\n2. Loop through it."
        },
        {
            title: "Virtual Environments",
            content: "Virtual environments isolate project dependencies.\n\nCreate one:\npython -m venv myenv\n\nActivate (Windows):\nmyenv\\Scripts\\activate\n\nPractice:\n1. Create a virtual environment.\n2. Install a package inside it."
        },
        {
            title: "Async Programming",
            content: "Async allows concurrent tasks.\n\nimport asyncio\n\nasync def main():\n    print('Hello')\n\nasyncio.run(main())\n\nPractice:\n1. Create an async function.\n2. Use await with asyncio.sleep()."
        },
        {
            title: "Working with APIs",
            content: "APIs allow communication between programs.\n\nExample using requests:\n\nimport requests\nresponse = requests.get('https://api.github.com')\nprint(response.status_code)\n\nPractice:\n1. Install requests package.\n2. Fetch data from a public API."
        }
    ];
    
    let currentLesson = 0;

    function loadLesson(index) {
        currentLesson = index;
        document.getElementById("title").innerText = lessons[index].title;
        document.getElementById("lesson").innerText = lessons[index].content;

        document.querySelectorAll(".sidebar a").forEach((link, i) => {
            link.classList.toggle("active", i === index);
        });

        document.getElementById("prevBtn").disabled = index === 0;
        document.getElementById("nextBtn").disabled = index === lessons.length - 1;
    }

    function prevLesson() {
        if (currentLesson > 0) loadLesson(currentLesson - 1);
    }

    function nextLesson() {
        if (currentLesson < lessons.length - 1) loadLesson(currentLesson + 1);
    }

    loadLesson(0);

</script>

<script>
/* ----------------------------
   Load Header & Footer Includes
----------------------------- */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-include]").forEach(el => {
    fetch(el.dataset.include)
      .then(res => res.text())
      .then(html => el.innerHTML = html)
      .catch(err => console.error("Include error:", err));
  });
});
</script>

</body>
</html>
