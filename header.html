<!-- ===== Header ===== -->
<header style="
  background:#2c3e50;
  color:#ecf0f1;
  padding:15px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
">

  <!-- Logo -->
  <div>
    <a href="/" style="display:block;">
      <img src="/logo.png" alt="TechStudy24By7"
        style="height:100px;width:auto;display:block;">
    </a>
  </div>

  <!-- Login / Register -->
  <div>
    <a href="/login/"
      style="
        background:#1abc9c;
        padding:8px 16px;
        margin-left:8px;
        color:#fff;
        text-decoration:none;
        border-radius:4px;
        font-weight:500;
        font-family:Segoe UI, sans-serif;
        display:inline-block;
      "
      onmouseover="this.style.opacity='0.8'"
      onmouseout="this.style.opacity='1'"
    >Login</a>

    <a href="/register/"
      style="
        background:#1abc9c;
        padding:8px 16px;
        margin-left:8px;
        color:#fff;
        text-decoration:none;
        border-radius:4px;
        font-weight:500;
        font-family:Segoe UI, sans-serif;
        display:inline-block;
      "
      onmouseover="this.style.opacity='0.8'"
      onmouseout="this.style.opacity='1'"
    >Register</a>
  </div>
</header>
