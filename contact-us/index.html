<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStudy24By7 — Master Skills Anytime, Anywhere</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
* {
  margin: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
}
.contact-page {
  background: #0f172a;
  color: #e5e7eb;
}
.contact-page h1 {
  font-size: 36px;
  margin-bottom: 20px;
  color: #ffffff;
}
.contact-page h2 {
  font-size: 24px;
  margin-top: 40px;
  margin-bottom: 12px;
  color: #00d4ff;
}
.contact-page p {
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 16px;
  color: #d1d5db;
}
.contact-info {
  background: rgba(255, 255, 255, 0.05);
  padding: 16px 20px;
  border-radius: 8px;
  margin: 24px 0;
}
.contact-form {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
}
.contact-form input,
.contact-form textarea {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  outline: none;
  color: #ffffff;
  padding: 12px 14px;
  margin-bottom: 14px;
  border-radius: 6px;
  font-size: 14px;
}
.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: rgba(255, 255, 255, 0.6);
}
.contact-form button {
  width: fit-content;
  padding: 12px 22px;
  background: #00d4ff;
  border: none;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
  transition: 0.3s;
}
.contact-form button:hover {
  background: #00a6d6;
}
.support-hours {
  margin-top: 30px;
  font-size: 14px;
  color: #9ca3af;
}
@media (max-width: 768px) {
  .container {
    padding: 40px 16px;
  }
  .contact-page h1 {
    font-size: 28px;
  }
  .contact-page h2 {
    font-size: 20px;
  }
}
#formMessage {
  margin-top: 16px;
  font-size: 15px;
  color: #00d4ff;
  min-height: 20px;
}
#formMessage.success {
  color: #22c55e;
}
  </style>
</head>
<body>

  <!-- Header -->
  <div data-include="/header.html"></div>

  <!-- Contact Us Section -->
<section class="contact-page">

  <div class="container">
    <h1>Contact Us</h1>

    <p>
      Have questions about our courses or need help choosing the right learning
      path? Feel free to reach out — we’re happy to help.
    </p>

    <div class="contact-info">
      <p><strong>Email:</strong> techstudy24by7@gmail.com</p>
      <p><strong>Location:</strong> Online / Worldwide</p>
    </div>

    <h2>Send Us a Message</h2>

    <form class="contact-form" id="contactForm">
  		<input type="text" placeholder="Your Name" required>
  		<input type="email" placeholder="Your Email" required>
  		<textarea rows="5" placeholder="Your Message" required></textarea>
  		<button type="submit">Send Message</button>
	</form>

	<p id="formMessage"></p>

    <div class="support-hours">
      <p><strong>Support Hours:</strong></p>
      <p>Monday – Friday | 9:00 AM – 6:00 PM (UTC)</p>
    </div>

  </div>

</section>

  <!-- Footer -->
  <div data-include="/footer.html"></div>

  <script>
/* ----------------------------
   Load Header & Footer Includes
----------------------------- */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-include]").forEach(el => {
    fetch(el.dataset.include)
      .then(res => res.text())
      .then(html => el.innerHTML = html)
      .catch(err => console.error("Include error:", err));
  });
});
</script>

</body>
