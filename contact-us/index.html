<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStudy24By7 — Master Skills Anytime, Anywhere</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/script.js"></script>
</head>
<body>

  <!-- Header -->
  <div data-include="/header.html"></div>

  <!-- Contact Us Section -->
<section class="contact-page">

  <div class="container">
    <h1>Contact Us</h1>

    <p>
      Have questions about our courses or need help choosing the right learning
      path? Feel free to reach out — we’re happy to help.
    </p>

    <div class="contact-info">
      <p><strong>Email:</strong> techstudy24by7@gmail.com</p>
      <p><strong>Location:</strong> Online / Worldwide</p>
    </div>

    <h2>Send Us a Message</h2>

    <form class="contact-form" id="contactForm">
  		<input type="text" placeholder="Your Name" required>
  		<input type="email" placeholder="Your Email" required>
  		<textarea rows="5" placeholder="Your Message" required></textarea>
  		<button type="submit">Send Message</button>
	</form>

	<p id="formMessage"></p>

    <div class="support-hours">
      <p><strong>Support Hours:</strong></p>
      <p>Monday – Friday | 9:00 AM – 6:00 PM (UTC)</p>
    </div>

  </div>

</section>

  <!-- Footer -->
  <div data-include="/footer.html"></div>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
